services:
  - type: web
    name: contextgraph-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: HYDRADB_TOKEN
        generateValue: true
      - key: CONTEXTGRAPH_CATALOG_SIZE
        value: "100"
