services:
  - type: web
    name: contextgraph-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: HYDRADB_TOKEN
        generateValue: true
      - key: CONTEXTGRAPH_CATALOG_SIZE
        value: "100"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
