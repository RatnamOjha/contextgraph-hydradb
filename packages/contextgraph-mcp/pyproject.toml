[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgraph-mcp"
version = "0.1.0"
description = "MCP context-routing adapter for ContextGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["contextgraph-sdk>=0.1,<0.2", "mcp>=2.0,<3"]
license = "MIT"
authors = [{name = "ContextGraph contributors"}]

[project.scripts]
contextgraph-mcp = "contextgraph_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
