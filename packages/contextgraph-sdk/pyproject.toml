[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgraph-sdk"
version = "0.1.0"
description = "Python client for ContextGraph tool-context retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "mcp>=2.0,<3"]
license = "MIT"
authors = [{name = "ContextGraph contributors"}]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
